[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reserva-ativa"
version = "0.1.0"
description = "Máquina reserva que assume serviços quando a principal cai e devolve quando ela volta, sem nunca deixar dois ativos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustavo Henrique Rocha" }]
keywords = ["failover", "standby", "high-availability", "watchdog", "industrial"]

[project.scripts]
reserva-ativa = "reserva_ativa.__main__:main"

[tool.setuptools]
packages = ["reserva_ativa"]
